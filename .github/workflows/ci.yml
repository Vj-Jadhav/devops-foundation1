name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Security Audit (Fail if root user found)
        run: |
          if grep -i "USER root" Dockerfile; then
            echo "Root user detected! Build Failed."
            exit 1
          fi

      - name: Build Docker Image
        run: docker build -t devops-capstone .

      - name: Success Message
        run: echo "Pipeline Completed Successfully!"